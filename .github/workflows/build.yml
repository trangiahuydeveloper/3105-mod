name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Archive (no code sign)
        run: |
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -archivePath build/3105.xcarchive \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates 2>&1 | tail -80

      - name: Package IPA (unsigned)
        run: |
          mkdir -p build/Payload
          cp -r build/3105.xcarchive/Products/Applications/3105.app build/Payload/
          cd build && zip -r ../3105_unsigned.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105_unsigned.ipa
          retention-days: 7
